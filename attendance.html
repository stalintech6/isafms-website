<!DOCTYPE html>
<html>
<head>
    <title>ISAFMS - Attendance System</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .section {
            background: white;
            padding: 15px;
            margin: 20px auto;
            width: 90%;
            box-shadow: 0 0 10px #ccc;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        button {
            padding: 5px 10px;
            margin: 5px;
            background: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .summary {
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>ISAFMS Attendance - <span id="date"></span></h1>

<div class="section">
    <h2>Section A</h2>
    <table id="sectionA">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Status</th>
        </tr>
    </table>
</div>

<div class="section">
    <h2>Section B</h2>
    <table id="sectionB">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Status</th>
        </tr>
    </table>
</div>

<div class="summary">
    Total Present: <span id="present">0</span> |
    Total Absent: <span id="absent">0</span>
</div>

<script>
const students = [
    // Section A (1–15)
    ...Array.from({length: 15}, (_, i) => ({ roll: i+1, name: "Student A" + (i+1), section: "A" })),
    // Section B (16–30)
    ...Array.from({length: 15}, (_, i) => ({ roll: i+16, name: "Student B" + (i+1), section: "B" }))
];

let attendance = JSON.parse(localStorage.getItem("attendance")) || {};

const today = new Date().toLocaleDateString();
document.getElementById("date").innerText = today;

if(!attendance[today]) {
    attendance[today] = {};
}

function saveAttendance() {
    localStorage.setItem("attendance", JSON.stringify(attendance));
}

function updateSummary() {
    let present = 0;
    let absent = 0;

    students.forEach(s => {
        if(attendance[today][s.roll] === "Present") present++;
        else absent++;
    });

    document.getElementById("present").innerText = present;
    document.getElementById("absent").innerText = absent;
}

function createTable(sectionId, sectionName) {
    const table = document.getElementById(sectionId);

    students.filter(s => s.section === sectionName).forEach(student => {
        const row = document.createElement("tr");

        const status = attendance[today][student.roll] || "Absent";
        attendance[today][student.roll] = status;

        row.innerHTML = `
            <td>${student.roll}</td>
            <td>${student.name}</td>
            <td>
                <button onclick="mark(${student.roll}, 'Present')">Present</button>
                <button onclick="mark(${student.roll}, 'Absent')">Absent</button>
                <br><strong>${status}</strong>
            </td>
        `;

        table.appendChild(row);
    });
}

function mark(roll, status) {
    attendance[today][roll] = status;
    saveAttendance();
    location.reload();
}

createTable("sectionA", "A");
createTable("sectionB", "B");
updateSummary();
</script>

</body>
</html>
