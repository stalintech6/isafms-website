<!DOCTYPE html>
<html>
<head>
    <title>ISAFMS Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;

            background-image: url('college.jpg'); /* image name same undali */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Dark overlay */
        body::before{
            content:"";
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background: rgba(0,0,0,0.5);
            z-index:-1;
        }

        .container{
            display:flex;
        }

        .sidebar{
            width:220px;
            background:#1e293b;
            color:white;
            height:100vh;
            padding:20px;
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:30px;
        }

        .sidebar ul{
            list-style:none;
            padding:0;
        }

        .sidebar li{
            padding:12px;
            margin:8px 0;
            background:#334155;
            border-radius:6px;
            cursor:pointer;
            transition:0.3s;
        }

        .sidebar li:hover{
            background:#2563eb;
        }

        .main{
            flex:1;
            padding:30px;
            color:white;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-top:30px;
        }

        .card{
            flex:1;
            background: rgba(255,255,255,0.9);
            padding:20px;
            border-radius:10px;
            box-shadow:0 4px 15px rgba(0,0,0,0.4);
            text-align:center;
            color:black;
        }

        .card h3{
            margin-bottom:10px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>ISAFMS</h2>
        <ul>
            <li onclick="goDashboard()">🏠 Dashboard</li>
            <li onclick="goAttendance()">📊 Attendance</li>
            <li onclick="goAssignments()">📝 Assignments</li>
            <li onclick="goAnnouncements()">📢 Announcements</li>
            <li onclick="logout()">🚪 Logout</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">
       <h1>INTEGRATED SMART ACADEMIC & FACULTY MANAGEMENT SYSTEM 🏫</h1>
        <h1>Welcome user 👋</h1>

        <div class="cards">
            <div class="card">
                <h3>Total Students</h3>
                <p>100</p>
            </div>

            <div class="card">
                <h3>Today Present</h3>
                <p>80</p>
            </div>

            <div class="card">
                <h3>Attendance %</h3>
                <p>85%</p>
            </div>
        </div>

    </div>

</div>

<script>
function goDashboard(){
    window.location.href="dashboard.html";
}

function goAttendance(){
    window.location.href="attendance.html";
}

function goAssignments(){
    window.location.href="assignments.html";
}

function goAnnouncements(){
    window.location.href="announcements.html";
}

function logout(){
    window.location.href="index.html";
}
</script>

</body>
</html>
