        }

        .controls {

        }

            padding: 6px;

        }

        table {

            border-collapse: collapse;
            width: 90%;
            background: white;
        }

        th, td {

            padding: 8px;

            color: white;
        }

        }

        .absentBtn {

        }

        .risk {

        .stats {

</head>

<script>

function markPresent(btn){
    btn.parentElement.style.background="#d4edda";
    updateCount();
}

function markAbsent(btn){
    btn.parentElement.style.background="#f8d7da";
    updateCount();
}

function updateCount(){
    let rows=document.querySelectorAll("#attendanceTable tbody tr");
    let present=0, absent=0;

    rows.forEach(row=>{
        let bg=row.cells[1].style.background;
        if(bg.includes("212")) present++;
        if(bg.includes("248")) absent++;
    });

    document.getElementById("presentCount").innerText=present;
    document.getElementById("absentCount").innerText=absent;
}

function searchStudent(){
    let input=document.getElementById("searchStudent").value.toLowerCase();
    let rows=document.querySelectorAll("#attendanceTable tbody tr");
    rows.forEach(row=>{
        let name=row.cells[0].innerText.toLowerCase();
        row.style.display=name.includes(input)?"":"none";
    });
}

function selectAllPresent(){
    let rows=document.querySelectorAll("#attendanceTable tbody tr");
    rows.forEach(row=>{
        row.cells[1].style.background="#d4edda";
    });
    updateCount();
}

function downloadReport(){
    let rows=document.querySelectorAll("#attendanceTable tbody tr");
    let csv="Name,Status,Attendance %,Risk\n";

    rows.forEach(row=>{
        let name=row.cells[0].innerText;
        let percent=row.querySelector(".percent").innerText;
        let risk=percent<75?"Below 75%":"Safe";
        let status=row.cells[1].style.background.includes("212")?"Present":"Absent";
        csv+=`${name},${status},${percent},${risk}\n`;
    });

    let blob=new Blob([csv],{type:"text/csv"});
    let link=document.createElement("a");
    link.href=URL.createObjectURL(blob);
    link.download="attendance_report.csv";
    link.click();
}

function checkRisk(){
    let rows=document.querySelectorAll("#attendanceTable tbody tr");
    rows.forEach(row=>{
        let percent=parseInt(row.querySelector(".percent").innerText);
        let cell=row.querySelector(".riskCell");
        if(percent<75){
            cell.innerHTML="⚠ Below 75%";
            cell.classList.add("risk");
        }else{
            cell.innerHTML="Safe";
        }
    });
}

checkRisk();

</script>
